<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sign Up — Sathi Navigation</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/auth.css" />
  
  <script src="js/api.js"></script>

  <!-- Init Theme before rendering to avoid flash -->
  <script>
    if (localStorage.getItem('sathiTheme') === 'night') {
      document.documentElement.classList.add('night-mode');
    }
  </script>
</head>
<body class="auth-wrapper">
  
  <div class="auth-bg">
    <!-- Floating Orbs -->
    <div style="position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(108,58,232,0.4) 0%, transparent 60%); top: -10%; left: -10%; border-radius: 50%; filter: blur(30px); animation: floatOrb 15s ease-in-out infinite;"></div>
    <div style="position: absolute; width: 250px; height: 250px; background: radial-gradient(circle, rgba(56,189,248,0.3) 0%, transparent 60%); bottom: -5%; right: -5%; border-radius: 50%; filter: blur(40px); animation: floatOrb 20s ease-in-out infinite reverse;"></div>
    <div style="position: absolute; width: 150px; height: 150px; background: radial-gradient(circle, rgba(34,197,94,0.2) 0%, transparent 60%); top: 40%; right: 15%; border-radius: 50%; filter: blur(20px); animation: floatOrb 18s ease-in-out infinite;"></div>
  </div>

  <style>
    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }
  </style>

  <!-- Quick Mode Toggle -->
  <div class="auth-top-actions">
    <div class="mode-toggle-group">
      <button class="mode-btn active" id="auth-mode-light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </button>
      <button class="mode-btn" id="auth-mode-night">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </div>

  <main class="auth-panel">
    <div class="auth-header" style="margin-bottom: 1.5rem;">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M8 11l3 3 5-5"/>
        </svg>
        <h1 class="auth-title">Create Account</h1>
      </div>
      <p class="auth-subtitle">Join Sathi to secure your journey.</p>
    </div>

    <form class="auth-form" id="signupForm" style="gap: 1.1rem;">
      
      <div class="input-group">
        <input type="text" id="fullname" class="auth-input" placeholder="Full Name" required autocomplete="name" />
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <div class="input-group">
        <input type="email" id="email" class="auth-input" placeholder="Email" required autocomplete="username" />
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>

      <div class="input-group">
        <input type="password" id="password" class="auth-input" placeholder="Password" required autocomplete="new-password" />
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <div class="input-group">
        <input type="password" id="confirm_password" class="auth-input" placeholder="Confirm Password" required autocomplete="new-password" />
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <button type="submit" class="auth-btn-primary" style="margin-top: 0.25rem;">Sign Up</button>
    </form>

    <div class="auth-divider" style="margin: 1.25rem 0;">Or sign up with</div>

    <div class="social-login-grid">
      <button class="social-btn" type="button" onclick="socialLogin('Google')">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button class="social-btn" type="button" onclick="socialLogin('Apple')">
        <svg viewBox="0 0 24 24" fill="var(--text-primary)">
          <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.95.89 3.67 2.06-3.41 1.83-2.83 6.78.36 8.01-.69 1.4-1.57 2.33-2.68 2.94zm-3.05-13.7c-.15-2.04 1.49-3.9 3.58-4.08.38 2.24-1.66 4.29-3.58 4.08z"/>
        </svg>
        Apple
      </button>
    </div>

    <div class="auth-footer" style="margin-top: 1.5rem;">
      Already have an account? <a href="login.html" class="auth-link">Log In</a>
    </div>
  </main>

  <script>
    // Theme Management
    const html = document.documentElement;
    const body = document.body;
    const btnLight = document.getElementById('auth-mode-light');
    const btnNight = document.getElementById('auth-mode-night');

    function setMode(mode) {
      if (mode === 'night') {
        html.classList.add('night-mode');
        body.classList.add('night-mode');
        btnNight.classList.add('active');
        btnLight.classList.remove('active');
      } else {
        html.classList.remove('night-mode');
        body.classList.remove('night-mode');
        btnLight.classList.add('active');
        btnNight.classList.remove('active');
      }
      localStorage.setItem('sathiTheme', mode);
    }

    // Initialize from local storage
    if (localStorage.getItem('sathiTheme') === 'night') {
      setMode('night');
    }

    btnLight.addEventListener('click', () => setMode('light'));
    btnNight.addEventListener('click', () => setMode('night'));

    // Handle SignUp
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirm_password').value;
      const email = document.getElementById('email').value;
      const name = document.getElementById('fullname').value;

      if(pwd !== confirmPwd) {
        alert("Passwords do not match!");
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.textContent = 'Creating Account...';
      submitBtn.disabled = true;

      try {
        // Use email as the mock firebaseUid for local development
        const response = await window.SathiAPI.registerUser({
          firebaseUid: email,
          name: name,
          email: email,
          phone: null
        });

        // Store auth tokens & user data
        localStorage.setItem('sathiAuthToken', response.user.id || 'mock-id');
        localStorage.setItem('sathiUserEmail', response.user.email);
        localStorage.setItem('sathiUserName', response.user.name);

        // Redirect to main app
        window.location.href = 'index.html';
      } catch (err) {
        alert("Sign Up Failed: " + err.message);
        submitBtn.textContent = 'Sign Up';
        submitBtn.disabled = false;
      }
    });

    function socialLogin(provider) {
      localStorage.setItem('sathiAuthToken', `mock-token-${provider.toLowerCase()}`);
      localStorage.setItem('sathiUserEmail', `user@${provider.toLowerCase()}.test`);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
